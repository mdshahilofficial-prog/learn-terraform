<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERRA ACADEMY | Infrastructure as Code Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070a12;
            --bg-card: #0f172a;
            --bg-card-hover: #1e293b;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #1e293b;
            --border-glow: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --interview-bg: #111827;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: var(--bg-dark); 
            color: var(--text-primary); 
            min-height: 100vh;
            padding: 2rem 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .brand-container { text-align: center; margin-bottom: 2.5rem; }
        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ffffff 0%, #a78bfa 50%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .brand-tagline { color: var(--text-secondary); font-size: 1rem; max-width: 600px; margin: 0 auto; }

        .search-section { margin-bottom: 2rem; max-width: 700px; margin-left: auto; margin-right: auto; }
        .search-wrapper { position: relative; display: flex; align-items: center; }
        .search-icon { position: absolute; left: 1.2rem; color: var(--accent); font-size: 1.2rem; }
        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            color: #fff;
            padding: 1rem 1rem 1rem 3.2rem;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s;
        }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 25px var(--accent-glow); }

        .pills-container { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem; }
        .pill-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.3s;
        }
        .pill-btn.active, .pill-btn:hover {
            background: linear-gradient(135deg, var(--accent), #6d28d9);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .level-select {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .progress-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            padding: 1.25rem 1.75rem;
            border-radius: 16px;
            margin-bottom: 2.5rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .progress-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .progress-bar-bg { background: var(--bg-dark); height: 10px; border-radius: 5px; overflow: hidden; border: 1px solid var(--border); }
        .progress-bar-fill { background: linear-gradient(90deg, var(--accent), var(--success)); height: 100%; width: 0%; transition: width 0.4s ease; }

        .concepts-grid { display: flex; flex-direction: column; gap: 2rem; }
        .concept-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 2rem;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .concept-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
        .badge-container { display: flex; gap: 0.5rem; align-items: center; }
        .badge-category { font-size: 0.75rem; padding: 0.3rem 0.75rem; border-radius: 20px; background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); font-weight: 600; }
        .badge-level { font-size: 0.75rem; padding: 0.3rem 0.75rem; border-radius: 20px; background: rgba(139, 92, 246, 0.15); color: var(--accent); border: 1px solid var(--accent); font-weight: 600; }

        .concept-card h2 { font-size: 1.6rem; color: #fff; margin-bottom: 0.5rem; }
        .concept-card p.summary { color: var(--text-secondary); margin-bottom: 1.5rem; line-height: 1.6; font-size: 1rem; }

        .lesson-section-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.25rem; margin-bottom: 1.25rem; }
        .detail-box { background: rgba(7, 10, 18, 0.6); padding: 1.25rem; border-radius: 12px; border: 1px solid var(--border); }
        .detail-box h4 { color: var(--accent); font-size: 0.9rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-box p, .detail-box ul { font-size: 0.92rem; color: #cbd5e1; line-height: 1.6; }

        .visual-container { margin: 1.25rem 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: #070a12; text-align: center; }
        .visual-container img { max-width: 100%; height: auto; display: block; margin: 0 auto; min-height: 120px; }
        .visual-fallback { padding: 2rem; background: rgba(139, 92, 246, 0.05); color: var(--accent); font-size: 0.9rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
        .visual-caption { padding: 0.5rem; font-size: 0.8rem; color: var(--text-secondary); background: rgba(15, 23, 42, 0.8); border-top: 1px solid var(--border); }

        .code-container { position: relative; margin: 1.25rem 0; border-radius: 8px; overflow: hidden; }
        .code-container pre { margin: 0 !important; padding-top: 2.5rem !important; }
        .copy-btn {
            position: absolute; top: 0.5rem; right: 0.5rem;
            background: rgba(30, 41, 59, 0.85); border: 1px solid var(--border-glow);
            color: var(--text-secondary); padding: 0.35rem 0.75rem; border-radius: 6px;
            font-size: 0.75rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; z-index: 10;
        }
        .copy-btn:hover { background: var(--accent); color: #fff; }
        .copy-btn.copied { background: var(--success); color: #fff; }

        /* INTERVIEW PERSPECTIVE */
        .interview-box {
            background: linear-gradient(180deg, rgba(17,24,39,.98), rgba(15,23,42,.98));
            border: 1px solid rgba(139,92,246,.65);
            border-radius: 16px;
            margin: 1.75rem 0;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,0,.28), 0 0 24px rgba(139,92,246,.08);
        }
        .interview-summary {
            width: 100%;
            border: 0;
            background: transparent;
            color: var(--text-primary);
            padding: 1.15rem 1.35rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            text-align: left;
        }
        .interview-summary:hover { background: rgba(139,92,246,.06); }
        .interview-summary-main { display:flex; align-items:center; gap:.75rem; }
        .interview-summary-main i { color: var(--accent); font-size:1.15rem; }
        .interview-summary-title { font-weight:800; }
        .interview-summary-meta { display:flex; gap:.45rem; flex-wrap:wrap; margin-top:.35rem; }
        .interview-badge {
            display:inline-flex; align-items:center; gap:.3rem;
            padding:.2rem .55rem; border-radius:999px;
            font-size:.68rem; font-weight:700;
            background:rgba(139,92,246,.12); color:#c4b5fd;
            border:1px solid rgba(139,92,246,.35);
        }
        .interview-chevron { transition:transform .2s ease; color:var(--text-secondary); }
        .interview-box.open .interview-chevron { transform:rotate(180deg); }
        .interview-content { display:none; padding:0 1.35rem 1.35rem; }
        .interview-box.open .interview-content { display:block; }
        .interview-inner { border-top:1px solid var(--border); padding-top:1.25rem; }
        .interview-q {
            font-size:1.05rem; color:#fff; font-weight:700; margin-bottom:1.15rem;
            padding:1rem 1rem 1rem 1.1rem; background:rgba(255,255,255,.035);
            border-left:3px solid var(--accent); border-radius:8px; line-height:1.55;
        }
        .interview-block { margin-bottom:1.15rem; }
        .interview-label {
            font-size:.78rem; text-transform:uppercase; letter-spacing:.5px;
            font-weight:800; margin-bottom:.4rem; display:flex;
            align-items:center; gap:.4rem;
        }
        .label-30s { color:var(--success); }
        .label-detailed { color:#60a5fa; }
        .label-prod { color:#c4b5fd; }
        .label-weak { color:var(--danger); }
        .label-strong { color:var(--success); }
        .label-tip { color:var(--warning); }
        .label-test { color:#22d3ee; }
        .label-scenario { color:#f472b6; }
        .interview-text { font-size:.92rem; color:#cbd5e1; line-height:1.7; }
        .interview-test-box, .interview-scenario {
            padding:1rem; border-radius:10px; margin:1rem 0;
            background:rgba(255,255,255,.025); border:1px solid var(--border);
        }
        .interview-scenario { border-left:3px solid #f472b6; }
        .comparison-grid {
            display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
            gap:1rem; margin:1rem 0;
        }
        .comparison-box { padding:1rem; border-radius:10px; background:rgba(0,0,0,.2); }
        .comparison-box.weak { border:1px solid rgba(239,68,68,.3); }
        .comparison-box.strong { border:1px solid rgba(16,185,129,.3); }
        .followup-list { display:grid; gap:.7rem; margin-top:.75rem; }
        .followup-item { border:1px solid var(--border); border-radius:10px; overflow:hidden; }
        .followup-question {
            width:100%; background:rgba(255,255,255,.025); border:0; color:#f1f5f9;
            padding:.85rem 1rem; cursor:pointer; display:flex; justify-content:space-between;
            gap:1rem; text-align:left; font-size:.88rem; font-weight:700;
        }
        .followup-question:hover { background:rgba(139,92,246,.06); }
        .followup-answer { display:none; padding:.85rem 1rem; color:#cbd5e1; line-height:1.65; font-size:.88rem; border-top:1px solid var(--border); }
        .followup-item.open .followup-answer { display:block; }
        .tip-box {
            background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.28);
            padding:1rem 1.15rem; border-radius:10px; margin-top:1rem;
        }

        .interactive-box { background: rgba(139, 92, 246, 0.05); border: 1px solid rgba(139, 92, 246, 0.2); border-radius: 12px; padding: 1.25rem; margin-top: 1.25rem; }
        .interactive-box h4 { color: var(--accent); font-size: 0.95rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .toggle-btn { background: var(--bg-card); border: 1px solid var(--border-glow); color: var(--text-primary); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; margin-top: 0.75rem; transition: all 0.2s; }
        .toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
        .collapsible-content { display: none; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px dashed var(--border); color: #cbd5e1; font-size: 0.9rem; }

        .footer-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); }
        .next-btn { background: rgba(139, 92, 246, 0.15); border: 1px solid var(--accent); color: var(--accent); padding: 0.5rem 1rem; border-radius: 30px; cursor: pointer; font-size: 0.85rem; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; transition: all 0.2s; }
        .next-btn:hover { background: var(--accent); color: #fff; }

        .complete-btn { background: transparent; border: 1px solid var(--success); color: var(--success); padding: 0.5rem 1.2rem; border-radius: 30px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .complete-btn.done { background: var(--success); color: white; }

        footer { margin-top: 4rem; text-align: center; padding: 2rem; border-top: 1px solid var(--border); color: var(--text-secondary); }
        button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        @media (max-width: 640px) {
            body { padding: 1.1rem .75rem; }
            .brand-title { font-size: 2.25rem; letter-spacing: 2px; }
            .concept-card { padding: 1.25rem; }
            .concept-card-header { align-items:flex-start; gap:.75rem; }
            .interview-summary { padding:1rem; }
            .interview-content { padding:0 1rem 1rem; }
            .interview-summary-main { align-items:flex-start; }
        }
    </style>
</head>
<body>

    <div class="brand-container">
        <h1 class="brand-title">TERRA ACADEMY</h1>
        <p class="brand-tagline">Master Infrastructure as Code from Core Fundamentals to Production Engineering</p>
        <div style="margin-top:.7rem; display:flex; justify-content:center; flex-wrap:wrap; gap:.45rem;">
            <span class="interview-badge">Learn</span>
            <span style="color:var(--text-secondary);">→</span>
            <span class="interview-badge">Understand</span>
            <span style="color:var(--text-secondary);">→</span>
            <span class="interview-badge">Practice</span>
            <span style="color:var(--text-secondary);">→</span>
            <span class="interview-badge">Production</span>
            <span style="color:var(--text-secondary);">→</span>
            <span class="interview-badge">Interview</span>
        </div>
    </div>

    <div class="search-section">
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="search-input" class="search-input" placeholder="Search concepts, commands, or code across all modules..." oninput="renderConcepts()">
        </div>
    </div>

    <div class="pills-container">
        <button class="pill-btn active" onclick="filterCategory('all', this)"><i class="fa-solid fa-globe"></i> All Modules</button>
        <button class="pill-btn" onclick="filterCategory('Fundamentals', this)">Fundamentals</button>
        <button class="pill-btn" onclick="filterCategory('HCL & Configuration', this)">HCL & Config</button>
        <button class="pill-btn" onclick="filterCategory('Resources', this)">Resources</button>
        <button class="pill-btn" onclick="filterCategory('Variables & Outputs', this)">Variables & Outputs</button>
        <button class="pill-btn" onclick="filterCategory('Data Sources', this)">Data Sources</button>
        <button class="pill-btn" onclick="filterCategory('Expressions & Functions', this)">Expressions & Functions</button>
        <button class="pill-btn" onclick="filterCategory('Meta-Arguments', this)">Meta-Arguments</button>
        <button class="pill-btn" onclick="filterCategory('Modules', this)">Modules</button>
        <button class="pill-btn" onclick="filterCategory('State', this)">State</button>
        <button class="pill-btn" onclick="filterCategory('Backend & Remote State', this)">Backend & Remote State</button>
        <button class="pill-btn" onclick="filterCategory('Workspaces', this)">Workspaces</button>
        <button class="pill-btn" onclick="filterCategory('Advanced Terraform', this)">Advanced Terraform</button>
        <button class="pill-btn" onclick="filterCategory('Terraform on Azure', this)">Terraform on Azure</button>
        <button class="pill-btn" onclick="filterCategory('CI/CD', this)">CI/CD</button>
        <button class="pill-btn" onclick="filterCategory('Security & Best Practices', this)">Security & Best Practices</button>
        <button class="pill-btn" onclick="filterCategory('Production', this)">Production</button>
        <button class="pill-btn" onclick="filterCategory('Interview Preparation', this)">Interview Prep</button>

        <select id="level-filter" class="level-select" onchange="renderConcepts()" aria-label="Filter by learning level">
            <option value="all">All Levels</option>
            <option value="Core">Core</option>
            <option value="Advanced">Advanced</option>
            <option value="Production">Production</option>
            <option value="Interview Trap">Interview Trap</option>
        </select>
        <button class="pill-btn" id="interview-filter-btn" onclick="toggleInterviewFilter(this)">
            <i class="fa-solid fa-microphone-lines"></i> Interview Ready
        </button>
    </div>

    <main>
        <section class="progress-card">
            <div class="progress-info">
                <div>
                    <strong style="color:var(--text-secondary); font-size:0.8rem; text-transform:uppercase; letter-spacing: 1px;">Your Progress</strong>
                    <h3 id="progress-text" style="color: #fff; font-size: 1.2rem; margin-top: 0.2rem;">0 / 0 completed</h3>
                </div>
                <strong id="progress-percent" style="font-size: 1.8rem; color: var(--accent);">0%</strong>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </section>

        <div id="results-meta" style="margin:-1rem 0 1rem; color:var(--text-secondary); font-size:.82rem; text-align:right;"></div>
        <section class="concepts-grid" id="concepts-container"></section>
    </main>

    <footer>
        <strong style="color: #fff; font-size: 1.1rem;">TERRA ACADEMY</strong><br>
        <span style="font-size: 0.9rem;">Architected for Future Cloud Engineers</span>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-hcl.min.js"></script>
    <script>
        const CONCEPTS = [
            {
                id: "c1",
                title: "1. Declarative Paradigm & State Alignment",
                category: "Fundamentals",
                level: "Core",
                summary: "Understanding how Terraform uses a declarative model to reach target infrastructure states without manual steps.",
                whatIsIt: "In a declarative model, you define WHAT end-state infrastructure you want created rather than writing procedural scripts describing HOW to create it step-by-step.",
                whyDoWeNeedIt: "Eliminates complex imperative bash/python scripts that break when re-executed or when cloud state drifts out of sync.",
                howItWorks: "Terraform Core reads configuration files (.tf), inspects current cloud infrastructure, compares them against state (.tfstate), and calculates execution diffs.",
                syntaxExample: `resource "aws_s3_bucket" "production_assets" {\n  bucket = "my-company-assets-prod-2026"\n\n  tags = {\n    Environment = "Production"\n    ManagedBy   = "Terraform"\n  }\n}`,
                imageUrl: "https://upload.wikimedia.org/wikipedia/commons/0/04/Terraform_Logo.svg",
                imageCaption: "Terraform Core execution flow mapping HCL files to provider APIs.",
                realWorldUsage: "Provisioning standardized multi-region AWS VPC networking clusters with automated subnet tag allocations.",
                commonMistakes: "Writing imperative inline provisioning scripts (`local-exec`) instead of relying on native declarative provider resources.",
                productionPerspective: "Declarative code makes infrastructure self-documenting, enabling strict GitOps review workflows via pull requests.",
                
                // PHASE 3: INTERVIEW PERSPECTIVE EXTENSION
                interviewPerspective: {
                    question: "How does Terraform's declarative approach differ from procedural tools like Ansible or Bash, and how does state reconcile drift?",
                    answer30s: "Declarative IaC focuses on defining the desired target state rather than execution steps. Terraform reads the configuration, inspects reality via provider APIs, compares both against the state file, and calculates the exact lifecycle delta required to reach alignment.",
                    answerDetailed: "In procedural tools, scripts issue step-by-step sequential commands that require complex conditional checks to maintain idempotency. Terraform's declarative model decouples execution logic from target definitions. During a `terraform plan`, Terraform builds a Directed Acyclic Graph (DAG) of resources, fetches real-world attributes, compares them against `.tfstate`, and generates an execution graph with create, update, or destroy actions.",
                    answerProduction: "In production, relying strictly on declarative resources guarantees GitOps auditability. If an out-of-band manual change occurs in the AWS Console (configuration drift), running `terraform plan` flags the divergence and proposes a corrective update or recreation to align remote reality back to code.",
                    followUps: [
                        { q: "Is Terraform purely declarative in all situations?", a: "Not entirely. Using `local-exec` or `remote-exec` provisioners introduces procedural side effects, breaking pure state reconciliation." },
                        { q: "What happens if someone manually modifies infrastructure outside Terraform?", a: "Terraform detects the discrepancy during the refresh phase of `terraform plan` and attempts to undo the manual change." }
                    ],
                    weakAnswer: "Declarative means Terraform is easier to write than Ansible because you don't write bash commands.",
                    strongAnswer: "Declarative means we define the target end-state in HCL. Terraform continuously reconciles code, the `.tfstate` metadata layer, and active cloud provider resources to calculate and apply necessary changes idempotently.",
                    interviewTip: "Start with the desired-state idea, then explain reconciliation. Avoid saying Terraform continuously monitors infrastructure; Terraform normally detects drift when you run a plan/apply or otherwise refresh state."
                },
                practiceTask: "Declare an S3 bucket with tags using declarative HCL and identify which provider argument sets ownership.",
                practiceSolution: "Use the `aws_s3_bucket` block and define tags inside a nested map structure.",
                nextConceptId: "c2"
            },
            {
                id: "c2",
                title: "2. HCL Syntax & Block Hierarchy",
                category: "HCL & Configuration",
                level: "Core",
                summary: "Mastering HashiCorp Configuration Language syntax, blocks, labels, and argument structure.",
                whatIsIt: "HCL (HashiCorp Configuration Language) is a human-readable, structured configuration language built specifically for infrastructure orchestration.",
                whyDoWeNeedIt: "Provides an easy-to-read syntax superior to raw JSON while maintaining strict machine readability and type validation.",
                howItWorks: "HCL parses declarations into Abstract Syntax Trees (AST) that Terraform interprets to build resource dependency graphs.",
                syntaxExample: `# Syntax: <BLOCK TYPE> "<TYPE LABEL>" "<NAME LABEL>" {}\nresource "aws_instance" "web_server" {\n  ami           = "ami-0c55b159cbfafe1f0"\n  instance_type = "t3.micro"\n}`,
                imageUrl: null,
                imageCaption: "Structuring HCL configuration files into clean modular layers.",
                realWorldUsage: "Organizing production repositories into structured `main.tf`, `variables.tf`, `outputs.tf`, and `providers.tf` files.",
                commonMistakes: "Forgetting quotes around string arguments or improperly nesting blocks inside incorrect parent blocks.",
                productionPerspective: "Enforce automated formatting using `terraform fmt -check` in pull request CI validation stages.",
                
                // PHASE 3: INTERVIEW PERSPECTIVE EXTENSION
                interviewPerspective: {
                    question: "Explain the structure of an HCL block and how Terraform handles file organization within a directory.",
                    answer30s: "An HCL block consists of a block type, block labels, and a body enclosed in braces. Terraform parses all `.tf` files in a working directory as a single unified configuration module regardless of file naming.",
                    answerDetailed: "HCL follows a uniform syntax: `block_type \"type_label\" \"name_label\" { key = value }`. When running Terraform commands, the parser combines all `.tf` files in the directory root into a single Abstract Syntax Tree. File names like `main.tf` or `variables.tf` are standard human conventions and do not affect Terraform's internal compilation.",
                    answerProduction: "In enterprise production repositories, standardizing file layouts (`main.tf`, `variables.tf`, `outputs.tf`, `providers.tf`, `versions.tf`) is essential for maintainability. We enforce formatting via `terraform fmt -check` and validate structural correctness using `terraform validate` during CI pipelines.",
                    followUps: [
                        { q: "Does Terraform execute `.tf` files in alphabetical order?", a: "No, execution order is determined purely by explicit and implicit resource dependencies, not file names or lexical order." }
                    ],
                    weakAnswer: "HCL is like JSON but without commas, and Terraform reads main.tf first.",
                    strongAnswer: "HCL uses structured blocks with identifiers and key-value arguments. Terraform concatenates all `.tf` files in a directory into one root module graph, relying on resource references rather than file ordering.",
                    interviewTip: "A strong answer separates file organization from resource dependency ordering. Terraform loads the configuration in the working directory as a module; resource ordering comes from dependencies, not filenames."
                },
                practiceTask: "Refactor a plain string variable assignment into a structured block argument.",
                practiceSolution: "Wrap related arguments inside `{}` block braces according to provider documentation specs.",
                nextConceptId: "c3"
            }
        ];

        let completed = JSON.parse(localStorage.getItem('completed_concepts') || '[]');
        let currentCategory = 'all';
        let interviewOnly = false;

        function handleImageError(imgElement) {
            const container = imgElement.parentElement;
            imgElement.style.display = 'none';
            
            const fallbackDiv = document.createElement('div');
            fallbackDiv.className = 'visual-fallback';
            fallbackDiv.innerHTML = '<i class="fa-solid fa-diagram-project" style="font-size: 2rem;"></i><span>Architecture Diagram Placeholder</span>';
            
            container.insertBefore(fallbackDiv, imgElement);
        }

        function renderConcepts() {
            const container = document.getElementById('concepts-container');
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const selectedLevel = document.getElementById('level-filter').value;
            container.innerHTML = '';

            const filtered = CONCEPTS.filter(c => {
                const matchesCategory = currentCategory === 'all' || c.category === currentCategory;
                const matchesLevel = selectedLevel === 'all' || c.level === selectedLevel;
                const matchesSearch = c.title.toLowerCase().includes(searchQuery) || 
                                      c.category.toLowerCase().includes(searchQuery) ||
                                      c.summary.toLowerCase().includes(searchQuery) ||
                                      (c.whatIsIt && c.whatIsIt.toLowerCase().includes(searchQuery));

                return matchesCategory && matchesLevel && matchesInterview && matchesSearch;
            });

            const resultsMeta = document.getElementById('results-meta');
            if (resultsMeta) {
                resultsMeta.textContent = `${filtered.length} concept${filtered.length === 1 ? '' : 's'} shown${interviewOnly ? ' • Interview-ready only' : ''}`;
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 3rem; color: var(--text-secondary);">
                        <i class="fa-solid fa-magnifying-glass" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                        <h3>No matching Terraform concepts found</h3>
                        <p>Try searching for a different keyword.</p>
                    </div>`;
                return;
            }

            filtered.forEach(item => {
                const isDone = completed.includes(item.id);
                const card = document.createElement('div');
                card.className = 'concept-card';
                card.id = `lesson-${item.id}`;

                let html = `
                    <div class="concept-card-header">
                        <div class="badge-container">
                            <span class="badge-category">${item.category}</span>
                            <span class="badge-level">${item.level}</span>
                        </div>
                        <button class="complete-btn ${isDone ? 'done' : ''}" onclick="toggleComplete('${item.id}')">
                            ${isDone ? '<i class="fa-solid fa-check"></i> Completed' : 'Mark Completed'}
                        </button>
                    </div>
                    <h2>${item.title}</h2>
                    <p class="summary">${item.summary}</p>

                    <div class="lesson-section-grid">
                        <div class="detail-box">
                            <h4><i class="fa-solid fa-circle-info"></i> 1. What is it?</h4>
                            <p>${item.whatIsIt || 'N/A'}</p>
                        </div>
                        <div class="detail-box">
                            <h4><i class="fa-solid fa-circle-question"></i> 2. Why do we need it?</h4>
                            <p>${item.whyDoWeNeedIt || 'Simplifies state management and infrastructure stability.'}</p>
                        </div>
                        <div class="detail-box">
                            <h4><i class="fa-solid fa-gears"></i> 3. How does it work?</h4>
                            <p>${item.howItWorks || 'Evaluated during execution graph generation.'}</p>
                        </div>
                    </div>
                `;

                if (item.syntaxExample) {
                    html += `
                        <div class="code-container">
                            <button class="copy-btn" onclick="copyCode(this)">
                                <i class="fa-regular fa-copy"></i> Copy Code
                            </button>
                            <pre><code class="language-hcl">${escapeHtml(item.syntaxExample)}</code></pre>
                        </div>
                    `;
                }

                if (item.imageUrl) {
                    html += `
                        <div class="visual-container">
                            <img src="${item.imageUrl}" onerror="handleImageError(this)" alt="Visual diagram for ${escapeHtml(item.title)}">
                            <div class="visual-caption"><i class="fa-solid fa-image"></i> ${item.imageCaption || 'Visual Architecture Overview'}</div>
                        </div>
                    `;
                }

                html += `
                    <div class="lesson-section-grid">
                        <div class="detail-box">
                            <h4><i class="fa-solid fa-building"></i> 4. Real-World Usage</h4>
                            <p>${item.realWorldUsage || 'Applied standardly across cloud workspaces.'}</p>
                        </div>
                        <div class="detail-box" style="border-left: 3px solid var(--warning);">
                            <h4><i class="fa-solid fa-bug"></i> 5. Common Mistakes</h4>
                            <p>${item.commonMistakes || 'Avoid hardcoding values.'}</p>
                        </div>
                        <div class="detail-box" style="border-left: 3px solid var(--accent);">
                            <h4><i class="fa-solid fa-industry"></i> 6. Production Perspective</h4>
                            <p>${item.productionPerspective || 'Follow strict GitOps practices.'}</p>
                        </div>
                    </div>
                `;

                // PHASE 3: CONCEPT-LEVEL INTERVIEW PERSPECTIVE
                if (item.interviewPerspective) {
                    const ip = item.interviewPerspective;
                    html += `
                        <section class="interview-box" id="interview-${item.id}">
                            <button class="interview-summary" type="button" onclick="toggleInterview(this)" aria-expanded="false">
                                <span>
                                    <span class="interview-summary-main">
                                        <i class="fa-solid fa-microphone-lines"></i>
                                        <span class="interview-summary-title">Interview Perspective</span>
                                    </span>
                                    <span class="interview-summary-meta">
                                        <span class="interview-badge"><i class="fa-solid fa-signal"></i> ${ip.difficulty || 'Interview Ready'}</span>
                                        <span class="interview-badge"><i class="fa-solid fa-comments"></i> ${ip.followUps?.length || 0} follow-ups</span>
                                    </span>
                                </span>
                                <i class="fa-solid fa-chevron-down interview-chevron"></i>
                            </button>

                            <div class="interview-content">
                                <div class="interview-inner">
                                    <div class="interview-q">
                                        <i class="fa-solid fa-circle-question"></i>
                                        ${ip.question}
                                    </div>

                                    <div class="interview-block">
                                        <div class="interview-label label-30s">
                                            <i class="fa-solid fa-stopwatch"></i> Recommended 30-Second Answer
                                        </div>
                                        <div class="interview-text">${ip.answer30s}</div>
                                    </div>

                                    <div class="interview-block">
                                        <div class="interview-label label-detailed">
                                            <i class="fa-solid fa-align-left"></i> Detailed Answer
                                        </div>
                                        <div class="interview-text">${ip.answerDetailed}</div>
                                    </div>

                                    ${ip.answerProduction ? `
                                        <div class="interview-block">
                                            <div class="interview-label label-prod">
                                                <i class="fa-solid fa-server"></i> Production-Level Answer
                                            </div>
                                            <div class="interview-text">${ip.answerProduction}</div>
                                        </div>
                                    ` : ''}

                                    ${ip.interviewerTesting ? `
                                        <div class="interview-test-box">
                                            <div class="interview-label label-test">
                                                <i class="fa-solid fa-bullseye"></i> What the Interviewer Is Testing
                                            </div>
                                            <div class="interview-text">${ip.interviewerTesting}</div>
                                        </div>
                                    ` : ''}

                                    ${ip.scenario ? `
                                        <div class="interview-scenario">
                                            <div class="interview-label label-scenario">
                                                <i class="fa-solid fa-briefcase"></i> Production Scenario
                                            </div>
                                            <div class="interview-text">${ip.scenario}</div>
                                        </div>
                                    ` : ''}

                                    <div class="comparison-grid">
                                        <div class="comparison-box weak">
                                            <div class="interview-label label-weak">
                                                <i class="fa-solid fa-xmark"></i> Weak / Common Answer
                                            </div>
                                            <div class="interview-text">${ip.weakAnswer}</div>
                                        </div>
                                        <div class="comparison-box strong">
                                            <div class="interview-label label-strong">
                                                <i class="fa-solid fa-check"></i> Strong Interview Answer
                                            </div>
                                            <div class="interview-text">${ip.strongAnswer}</div>
                                        </div>
                                    </div>

                                    ${ip.followUps && ip.followUps.length ? `
                                        <div class="interview-block">
                                            <div class="interview-label" style="color:#a78bfa;">
                                                <i class="fa-solid fa-comments"></i> Interviewer Follow-Ups
                                            </div>
                                            <div class="followup-list">
                                                ${ip.followUps.map((fq, index) => `
                                                    <div class="followup-item">
                                                        <button class="followup-question" type="button" onclick="toggleFollowUp(this)" aria-expanded="false">
                                                            <span><strong>Q${index + 1}.</strong> ${fq.q}</span>
                                                            <i class="fa-solid fa-plus"></i>
                                                        </button>
                                                        <div class="followup-answer">
                                                            <strong style="color:#a78bfa;">Recommended answer:</strong><br>
                                                            ${fq.a}
                                                        </div>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        </div>
                                    ` : ''}

                                    <div class="tip-box">
                                        <div class="interview-label label-tip">
                                            <i class="fa-solid fa-lightbulb"></i> Interview Tip
                                        </div>
                                        <div class="interview-text" style="color:#fef08a;">${ip.interviewTip}</div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    `;
                }

                if (item.practiceTask) {
                    html += `
                        <div class="interactive-box" style="background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.2);">
                            <h4 style="color: var(--success);"><i class="fa-solid fa-terminal"></i> Practice Exercise</h4>
                            <p style="font-size: 0.92rem; color: #cbd5e1;">${item.practiceTask}</p>
                            <button class="toggle-btn" onclick="toggleCollapsible(this)">Show Hint / Solution</button>
                            <div class="collapsible-content">${item.practiceSolution || 'Solution details.'}</div>
                        </div>
                    `;
                }

                html += `
                    <div class="footer-nav">
                        <span style="font-size: 0.8rem; color: var(--text-secondary);">Module Step Completed?</span>
                        ${item.nextConceptId ? `
                            <button class="next-btn" onclick="scrollToConcept('${item.nextConceptId}')">
                                Next Concept <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        ` : ''}
                    </div>
                `;

                card.innerHTML = html;
                container.appendChild(card);
            });

            Prism.highlightAll();
            updateProgress();
        }

        function toggleCollapsible(btn) {
            const content = btn.nextElementSibling;
            if (content.style.display === 'block') {
                content.style.display = 'none';
                btn.textContent = btn.textContent.replace('Hide', 'Show');
            } else {
                content.style.display = 'block';
                btn.textContent = btn.textContent.replace('Show', 'Hide');
            }
        }

        function toggleInterview(btn) {
            const box = btn.closest('.interview-box');
            const expanded = box.classList.toggle('open');
            btn.setAttribute('aria-expanded', String(expanded));
        }

        function toggleFollowUp(btn) {
            const item = btn.closest('.followup-item');
            const expanded = item.classList.toggle('open');
            btn.setAttribute('aria-expanded', String(expanded));
            const icon = btn.querySelector('i');
            if (icon) icon.className = expanded ? 'fa-solid fa-minus' : 'fa-solid fa-plus';
        }

        function toggleInterviewFilter(btn) {
            interviewOnly = !interviewOnly;
            btn.classList.toggle('active', interviewOnly);
            renderConcepts();
        }

        function scrollToConcept(id) {
            const element = document.getElementById(`lesson-${id}`);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function copyCode(button) {
            const container = button.closest('.code-container');
            const codeText = container.querySelector('code').textContent;
            navigator.clipboard.writeText(codeText).then(() => {
                button.classList.add('copied');
                button.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
                setTimeout(() => {
                    button.classList.remove('copied');
                    button.innerHTML = '<i class="fa-regular fa-copy"></i> Copy Code';
                }, 2000);
            });
        }

        function toggleComplete(id) {
            if (completed.includes(id)) {
                completed = completed.filter(i => i !== id);
            } else {
                completed.push(id);
            }
            localStorage.setItem('completed_concepts', JSON.stringify(completed));
            renderConcepts();
        }

        function updateProgress() {
            const total = CONCEPTS.length;
            const done = completed.length;
            const pct = Math.round((done / total) * 100) || 0;
            document.getElementById('progress-text').textContent = `${done} / ${total} completed`;
            document.getElementById('progress-percent').textContent = `${pct}%`;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        function filterCategory(cat, btnElement) {
            currentCategory = cat;
            document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            renderConcepts();
        }

        renderConcepts();
    </script>
</body>
</html>
