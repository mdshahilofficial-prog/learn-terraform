<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERRA ACADEMY | Infrastructure as Code Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070a12;
            --bg-card: #0f172a;
            --bg-card-hover: #1e293b;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #1e293b;
            --border-glow: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --interview-bg: #111827;
            --production-bg: #0b1329;
            --production-border: #3b82f6;
            --production-glow: rgba(59, 130, 246, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: var(--bg-dark); 
            color: var(--text-primary); 
            min-height: 100vh;
            padding: 2rem 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .brand-container { text-align: center; margin-bottom: 2.5rem; }
        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ffffff 0%, #a78bfa 50%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .brand-tagline { color: var(--text-secondary); font-size: 1rem; max-width: 600px; margin: 0 auto; }

        .search-section { margin-bottom: 2rem; max-width: 700px; margin-left: auto; margin-right: auto; }
        .search-wrapper { position: relative; display: flex; align-items: center; }
        .search-icon { position: absolute; left: 1.2rem; color: var(--accent); font-size: 1.2rem; }
        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            color: #fff;
            padding: 1rem 1rem 1rem 3.2rem;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s;
        }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 25px var(--accent-glow); }

        .pills-container { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem; }
        .pill-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.3s;
        }
        .pill-btn.active, .pill-btn:hover {
            background: linear-gradient(135deg, var(--accent), #6d28d9);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .level-select {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .progress-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            padding: 1.25rem 1.75rem;
            border-radius: 16px;
            margin-bottom: 2.5rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .progress-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .progress-bar-bg { background: var(--bg-dark); height: 10px; border-radius: 5px; overflow: hidden; border: 1px solid var(--border); }
        .progress-bar-fill { background: linear-gradient(90deg, var(--accent), var(--success)); height: 100%; width: 0%; transition: width 0.4s ease; }

        .concepts-grid { display: flex; flex-direction: column; gap: 2rem; }
        .concept-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 2rem;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .concept-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
        .badge-container { display: flex; gap: 0.5rem; align-items: center; }
        .badge-category { font-size: 0.75rem; padding: 0.3rem 0.75rem; border-radius: 20px; background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); font-weight: 600; }
        .badge-level { font-size: 0.75rem; padding: 0.3rem 0.75rem; border-radius: 20px; background: rgba(139, 92, 246, 0.15); color: var(--accent); border: 1px solid var(--accent); font-weight: 600; }

        .concept-card h2 { font-size: 1.6rem; color: #fff; margin-bottom: 0.5rem; }
        .concept-card p.summary { color: var(--text-secondary); margin-bottom: 1.5rem; line-height: 1.6; font-size: 1rem; }

        .lesson-section-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.25rem; margin-bottom: 1.25rem; }
        .detail-box { background: rgba(7, 10, 18, 0.6); padding: 1.25rem; border-radius: 12px; border: 1px solid var(--border); }
        .detail-box h4 { color: var(--accent); font-size: 0.9rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-box p, .detail-box ul { font-size: 0.92rem; color: #cbd5e1; line-height: 1.6; }

        .visual-container { margin: 1.25rem 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: #070a12; text-align: center; }
        .visual-container img { max-width: 100%; height: auto; display: block; margin: 0 auto; min-height: 120px; }
        .visual-fallback { padding: 2rem; background: rgba(139, 92, 246, 0.05); color: var(--accent); font-size: 0.9rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
        .visual-caption { padding: 0.5rem; font-size: 0.8rem; color: var(--text-secondary); background: rgba(15, 23, 42, 0.8); border-top: 1px solid var(--border); }

        .code-container { position: relative; margin: 1.25rem 0; border-radius: 8px; overflow: hidden; }
        .code-container pre { margin: 0 !important; padding-top: 2.5rem !important; }
        .copy-btn {
            position: absolute; top: 0.5rem; right: 0.5rem;
            background: rgba(30, 41, 59, 0.85); border: 1px solid var(--border-glow);
            color: var(--text-secondary); padding: 0.35rem 0.75rem; border-radius: 6px;
            font-size: 0.75rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; z-index: 10;
        }
        .copy-btn:hover { background: var(--accent); color: #fff; }
        .copy-btn.copied { background: var(--success); color: #fff; }

        /* PRODUCTION PERSPECTIVE SECTION STYLES */
        .production-toggle-btn {
            width: 100%;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--production-border);
            color: #60a5fa;
            padding: 0.85rem 1.25rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            transition: all 0.25s ease;
        }
        .production-toggle-btn:hover {
            background: var(--production-border);
            color: #fff;
            box-shadow: 0 4px 15px var(--production-glow);
        }

        .production-box {
            display: none;
            background: var(--production-bg);
            border: 1px solid var(--production-border);
            border-radius: 14px;
            padding: 1.5rem;
            margin-top: 1rem;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
        }
        .production-title {
            color: #60a5fa;
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        .prod-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 1.25rem; }
        .prod-card { background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border); padding: 1rem; border-radius: 10px; }
        .prod-card-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.4rem; }
        .prod-card-title.how { color: #60a5fa; }
        .prod-card-title.why { color: var(--success); }
        .prod-card-title.arch { color: var(--accent); }
        .prod-card-title.rec { color: #38bdf8; }
        .prod-card-title.mistake { color: var(--danger); }
        .prod-card-title.sec { color: #f472b6; }
        .prod-card-title.scale { color: #a78bfa; }
        .prod-card-title.trouble { color: var(--warning); }

        .trouble-box {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            padding: 1.25rem;
            margin-top: 1rem;
        }

        /* INTERVIEW PERSPECTIVE SECTION STYLES */
        .interview-toggle-btn {
            width: 100%;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.85rem 1.25rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            transition: all 0.25s ease;
        }
        .interview-toggle-btn:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .interview-box {
            display: none;
            background: var(--interview-bg);
            border: 1px solid var(--accent);
            border-radius: 14px;
            padding: 1.5rem;
            margin-top: 1rem;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.15);
        }
        .interview-title {
            color: var(--accent);
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }
        .interview-q {
            font-size: 1.05rem;
            color: #fff;
            font-weight: 600;
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--accent);
            border-radius: 4px;
        }
        .interview-block { margin-bottom: 1.25rem; }
        .interview-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            margin-bottom: 0.35rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .label-30s { color: var(--success); }
        .label-detailed { color: #60a5fa; }
        .label-prod { color: var(--accent); }
        .label-testing { color: #f472b6; }
        .label-scenario { color: var(--warning); }
        .label-weak { color: var(--danger); }
        .label-strong { color: var(--success); }
        .label-tip { color: var(--warning); }
        .interview-text { font-size: 0.92rem; color: #cbd5e1; line-height: 1.6; }

        .scenario-box {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 1rem 1.25rem;
            border-radius: 10px;
            margin-bottom: 1.25rem;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
            margin: 1.25rem 0;
        }
        .comparison-box {
            padding: 1rem;
            border-radius: 8px;
            background: rgba(0,0,0,0.25);
        }
        .comparison-box.weak { border: 1px solid rgba(239, 68, 68, 0.3); }
        .comparison-box.strong { border: 1px solid rgba(16, 185, 129, 0.3); }

        .tip-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 0.9rem 1.25rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .interactive-box { background: rgba(139, 92, 246, 0.05); border: 1px solid rgba(139, 92, 246, 0.2); border-radius: 12px; padding: 1.25rem; margin-top: 1.25rem; }
        .interactive-box h4 { color: var(--accent); font-size: 0.95rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .toggle-btn { background: var(--bg-card); border: 1px solid var(--border-glow); color: var(--text-primary); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; margin-top: 0.75rem; transition: all 0.2s; }
        .toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
        .collapsible-content { display: none; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px dashed var(--border); color: #cbd5e1; font-size: 0.9rem; }

        .footer-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); }
        .next-btn { background: rgba(139, 92, 246, 0.15); border: 1px solid var(--accent); color: var(--accent); padding: 0.5rem 1rem; border-radius: 30px; cursor: pointer; font-size: 0.85rem; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; transition: all 0.2s; }
        .next-btn:hover { background: var(--accent); color: #fff; }

        .complete-btn { background: transparent; border: 1px solid var(--success); color: var(--success); padding: 0.5rem 1.2rem; border-radius: 30px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .complete-btn.done { background: var(--success); color: white; }

        footer { margin-top: 4rem; text-align: center; padding: 2rem; border-top: 1px solid var(--border); color: var(--text-secondary); }
    </style>
</head>
<body>

    <div class="brand-container">
        <h1 class="brand-title">TERRA ACADEMY</h1>
        <p class="brand-tagline">Master Infrastructure as Code from Core Fundamentals to Production Engineering</p>
    </div>

    <div class="search-section">
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="search-input" class="search-input" placeholder="Search concepts, commands, production scenarios, or interview terms..." oninput="renderConcepts()">
        </div>
    </div>

    <div class="pills-container">
        <button class="pill-btn active" onclick="filterCategory('all', this)"><i class="fa-solid fa-globe"></i> All Modules</button>
        <button class="pill-btn" onclick="filterCategory('production-ready', this)"><i class="fa-solid fa-server"></i> 🏢 Production Ready</button>
        <button class="pill-btn" onclick="filterCategory('interview-ready', this)"><i class="fa-solid fa-user-ninja"></i> 🎤 Interview Ready</button>
        <button class="pill-btn" onclick="filterCategory('Fundamentals', this)">Fundamentals</button>
        <button class="pill-btn" onclick="filterCategory('HCL & Configuration', this)">HCL & Config</button>
        <button class="pill-btn" onclick="filterCategory('Resources', this)">Resources</button>
        <button class="pill-btn" onclick="filterCategory('Variables & Outputs', this)">Variables & Outputs</button>
        <button class="pill-btn" onclick="filterCategory('Data Sources', this)">Data Sources</button>
        <button class="pill-btn" onclick="filterCategory('Expressions & Functions', this)">Expressions & Functions</button>
        <button class="pill-btn" onclick="filterCategory('Meta-Arguments', this)">Meta-Arguments</button>
        <button class="pill-btn" onclick="filterCategory('Modules', this)">Modules</button>
        <button class="pill-btn" onclick="filterCategory('State', this)">State</button>
        <button class="pill-btn" onclick="filterCategory('Backend & Remote State', this)">Backend & Remote State</button>
        <button class="pill-btn" onclick="filterCategory('Workspaces', this)">Workspaces</button>
        <button class="pill-btn" onclick="filterCategory('Advanced Terraform', this)">Advanced Terraform</button>
        <button class="pill-btn" onclick="filterCategory('Terraform on Azure', this)">Terraform on Azure</button>
        <button class="pill-btn" onclick="filterCategory('CI/CD', this)">CI/CD</button>
        <button class="pill-btn" onclick="filterCategory('Security & Best Practices', this)">Security & Best Practices</button>
        <button class="pill-btn" onclick="filterCategory('Production', this)">Production</button>
        <button class="pill-btn" onclick="filterCategory('Interview Preparation', this)">Interview Prep</button>

        <select id="level-filter" class="level-select" onchange="renderConcepts()">
            <option value="all">All Levels</option>
            <option value="Core">Core</option>
            <option value="Advanced">Advanced</option>
            <option value="Production">Production</option>
            <option value="Interview Trap">Interview Trap</option>
        </select>
    </div>

    <main>
        <section class="progress-card">
            <div class="progress-info">
                <div>
                    <strong style="color:var(--text-secondary); font-size:0.8rem; text-transform:uppercase; letter-spacing: 1px;">Your Progress</strong>
                    <h3 id="progress-text" style="color: #fff; font-size: 1.2rem; margin-top: 0.2rem;">0 / 0 completed</h3>
                </div>
                <strong id="progress-percent" style="font-size: 1.8rem; color: var(--accent);">0%</strong>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </section>

        <section class="concepts-grid" id="concepts-container"></section>
    </main>

    <footer>
        <strong style="color: #fff; font-size: 1.1rem;">TERRA ACADEMY</strong><br>
        <span style="font-size: 0.9rem;">Architected for Future Cloud Engineers</span>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-hcl.min.js"></script>
    <script>
        const CONCEPTS = [
            {
                id: "c1",
                title: "1. Declarative Paradigm & State Alignment",
                category: "Fundamentals",
                level: "Core",
                summary: "Understanding how Terraform uses a declarative model to reach target infrastructure states without manual steps.",
                whatIsIt: "In a declarative model, you define WHAT end-state infrastructure you want created rather than writing procedural scripts describing HOW to create it step-by-step.",
                whyDoWeNeedIt: "Eliminates complex imperative bash/python scripts that break when re-executed or when cloud state drifts out of sync.",
                howItWorks: "Terraform Core reads configuration files (.tf), inspects current cloud infrastructure, compares them against state (.tfstate), and calculates execution diffs.",
                syntaxExample: `resource "aws_s3_bucket" "production_assets" {\n  bucket = "my-company-assets-prod-2026"\n\n  tags = {\n    Environment = "Production"\n    ManagedBy   = "Terraform"\n  }\n}`,
                imageUrl: "https://upload.wikimedia.org/wikipedia/commons/0/04/Terraform_Logo.svg",
                imageCaption: "Terraform Core execution flow mapping HCL files to provider APIs.",
                realWorldUsage: "Provisioning standardized multi-region AWS VPC networking clusters with automated subnet tag allocations.",
                commonMistakes: "Writing imperative inline provisioning scripts (`local-exec`) instead of relying on native declarative provider resources.",
                productionPerspective: "Declarative code makes infrastructure self-documenting, enabling strict GitOps review workflows via pull requests.",
                productionPerspectiveData: {
                    howUsed: "Used in GitOps automated pipelines (GitHub Actions, Azure DevOps) to ensure cloud topology exactly mirrors code merged to main.",
                    whyItMatters: "Eliminates configuration drift and environment fragmentation across multi-region enterprise cloud infrastructure.",
                    productionArchitecture: "Main Git repository triggers automated plan on pull request and apply on merge, pointing to remote encrypted state stores.",
                    recommendedApproach: "Avoid provisioners like local-exec; use native cloud provider resource declarations and cloud-init scripts.",
                    commonMistakes: "Executing manual out-of-band console changes or embedding imperative shell commands that bypass graph execution.",
                    security: "Enforce strict RBAC permissions so engineers apply changes through CI/CD service principals rather than personal administrative accounts.",
                    scalability: "Deconstruct monolith configurations into decoupled root modules organized by domain boundary (Network, Data, Compute).",
                    troubleshootingScenario: "A developer manually altered a Production Security Group in the AWS console to fix an urgent outage. Running `terraform plan` now shows Terraform trying to destroy the manual rule.",
                    troubleshootingAnswer: "1. Review the plan diff. 2. Decide whether to adopt the manual change into HCL code or let Terraform revert it. 3. If adopting, add the rule to HCL and re-run plan to verify 0 changes before merging."
                },
                interviewPerspective: {
                    difficulty: "🟢 Basic",
                    question: "How does Terraform's declarative model differ from imperative scripting, and how does it handle drift?",
                    answer30s: "In a declarative approach, we declare the end state in code, and Terraform determines the steps required to achieve that state. Rather than sequentially executing commands like Bash, Terraform reads the configuration, inspects current resources via provider APIs, compares both against the state file, and applies only the calculated diff.",
                    answerDetailed: "Procedural tools require step-by-step logic, making idempotency difficult to maintain without heavy conditional checks. Terraform builds a Directed Acyclic Graph (DAG) of all resources, evaluates implicit/explicit dependencies, refreshes state against real cloud metadata, and generates an execution plan with precise create, update, or destroy actions.",
                    answerProduction: "In production, declarative infrastructure enforces GitOps. If someone manually changes a security group in the cloud console, Terraform detects this drift during `terraform plan` and proposes a change to revert the infrastructure back to the code's truth.",
                    interviewerTesting: "The interviewer wants to see if you understand idempotency, state reconciliation, and how Terraform detects manual configuration drift.",
                    scenario: "An engineer manually modified a Security Group rule in the AWS Console to fix an outage. When running `terraform plan`, Terraform attempts to revert it. How do you handle this?",
                    followUps: [
                        { q: "Is Terraform purely declarative in all cases?", a: "Not entirely. Using provisioners like `local-exec` or `remote-exec` introduces imperative side effects that fall outside of Terraform's state graph." },
                        { q: "What is idempotency?", a: "Idempotency means running the exact same Terraform apply multiple times produces the exact same end state without unintended duplicate resources." }
                    ],
                    weakAnswer: "Declarative means Terraform is easier than Ansible because you don't write bash scripts.",
                    strongAnswer: "Declarative means we declare the target end state in HCL. Terraform continuously reconciles configuration, state metadata, and cloud provider APIs to calculate and execute necessary diffs idempotently.",
                    interviewTip: "When answering, mention 'idempotency', 'graph reconciliation', and 'state file comparison'."
                },
                practiceTask: "Declare an S3 bucket with tags using declarative HCL and identify which provider argument sets ownership.",
                practiceSolution: "Use the `aws_s3_bucket` block and define tags inside a nested map structure.",
                nextConceptId: "c2"
            },
            {
                id: "c2",
                title: "2. HCL Syntax & Block Hierarchy",

            const done = completed.length;
            const pct = Math.round((done / total) * 100) || 0;
            document.getElementById('progress-text').textContent = `${done} / ${total} completed`;
            document.getElementById('progress-percent').textContent = `${pct}%`;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        function filterCategory(cat, btnElement) {
            currentCategory = cat;
            document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            renderConcepts();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderConcepts();
        });
    </script>
</body>
</html>
